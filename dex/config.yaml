# ====================================================================
# PeerMesh Dex OpenID Connect (OIDC) Identity Provider Configuration
# ====================================================================

# The base path of dex and the external name of the OpenID Connect service.
issuer: http://localhost:5556/dex

# Storage configuration - in-memory storage for rapid development & portability
storage:
  type: memory

# Configuration for the HTTP server
web:
  http: 0.0.0.0:5556
  allowedOrigins:
    - "http://localhost:5173"
    - "http://127.0.0.1:5173"
    - "http://localhost:3000"
    - "http://127.0.0.1:3000"
    - "http://localhost:8085"
    - "http://127.0.0.1:8085"

# Configuration for telemetry/health endpoint
telemetry:
  http: 0.0.0.0:5558

# Branding and UI configuration
frontend:
  issuer: "PeerMesh Identity Provider"
  theme: "light"

# Static OAuth2 / OIDC clients configured for the PeerMesh frontend & backend
staticClients:
  - id: peermesh-app
    redirectURIs:
      - 'http://localhost:5173'
      - 'http://127.0.0.1:5173'
      - 'http://localhost:5173/callback'
      - 'http://127.0.0.1:5173/callback'
      - 'http://localhost:3000'
      - 'http://127.0.0.1:3000'
      - 'http://localhost:3000/callback'
      - 'http://127.0.0.1:3000/callback'
      - 'http://localhost:8085/api/auth/dex/callback'
      - 'http://127.0.0.1:8085/api/auth/dex/callback'
    name: 'PeerMesh Network'
    secret: 'peermesh-dex-secret'
    public: true

# Enable local password database for static users
enablePasswordDB: true

# ====================================================================
# Provisioned Dex Users (Mapped to PeerMesh Network Personas)
# Default password for all provisioned users is: password
